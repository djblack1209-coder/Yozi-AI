[package]
name = "yozi-ai-desktop"
version = "2.3.0"
description = "Yozi AI conversation learning desktop host"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSResponder", "NSSharingService", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "FoundationErrors", "NSError", "NSGeometry"] }

# macOS 27 rejects stripped proc-macro dylibs with a misaligned LINKEDIT pool.
# Build dependencies are compile-time only; keep their symbols loadable.
[profile.release.build-override]
strip = "none"
