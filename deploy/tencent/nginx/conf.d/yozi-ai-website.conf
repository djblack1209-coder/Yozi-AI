# Standalone reference website; self-hosted resources and original API routes.
server {
 listen 127.0.0.1:8113;
 server_name yozi.bot.cd;
 root /opt/vps-config/releases/dnshe-product-web/yozi-yoga-cursor-20261106-e855b03f9a5b;
 index index.html;
 add_header Cache-Control "no-transform" always;
 client_max_body_size 20m;
 add_header X-Frame-Options "DENY" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
 location = / { expires -1; try_files /index.html =404; }
 location = /index.html { expires -1; try_files $uri =404; }
 location = /health { proxy_pass http://127.0.0.1:3002/health; proxy_set_header Host $host; }
 location /exam-master/ {
  proxy_pass http://127.0.0.1:3002/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 300s;
 }
 location = /sw.js { expires -1; try_files $uri =404; }
 location = /registerSW.js { expires -1; try_files $uri =404; }
 location = /manifest.webmanifest { expires -1; try_files $uri =404; }
 error_page 404 /404.html;
 location = /404.html { expires -1; }
 location / { try_files $uri $uri/ =404; }
 location ~* \.(js|css|woff2?|ttf|png|jpg|jpeg|svg|webp|ico)$ { expires 30d; try_files $uri =404; }
 location ~ /\. { deny all; }
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
}
